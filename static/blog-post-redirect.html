<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Redirecting… | Srijayee</title>
<meta name="robots" content="noindex">
</head>
<body style="background:#000;color:#fff;font-family:sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;">
  <p>Redirecting… if this takes more than a moment, <a id="fallback" href="/blog/" style="color:#fff;">go to the Journal</a>.</p>
  <script>
    var params = new URLSearchParams(window.location.search);
    var slug = params.get('slug');
    if (slug) {
      window.location.replace('/blog/' + encodeURIComponent(slug) + '/');
    } else {
      window.location.replace('/blog/');
    }
  </script>
</body>
</html>
